[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docvault"
version = "0.1.0"
description = "Offline document organizer with folder-as-database and human-readable metadata"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "anthropic>=0.40",
    "openai>=1.40",
    "pypdf>=4.0",
    "pypdfium2>=4.30",
    "Pillow>=10.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
docvault = "docvault.cli:app"

[tool.setuptools.packages.find]
include = ["docvault*"]

[tool.setuptools.package-data]
docvault = ["static/*.html", "static/*.js", "static/*.css", "static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
